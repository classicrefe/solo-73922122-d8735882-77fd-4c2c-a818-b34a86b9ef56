<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}循环泵累计故障率核算{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <div class="brand">循环泵可靠性核算台</div>
  <nav>
    <a href="{{ url_for('index') }}">汇总与上传</a>
    <a href="{{ url_for('pumps') }}">台账</a>
    <a href="{{ url_for('roster_page') }}">配对名单</a>
    <a href="{{ url_for('query_page') }}">故障率查询</a>
  </nav>
</header>
<main class="container">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <section class="flashes">
        {% for category, message in messages %}
          <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
      </section>
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<footer class="footer">SQLite 事务保证：台账、汇总与配对名单同时生效，失败回滚沿用原数据；查询只读。</footer>
</body>
</html>
